name: CI/CD

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Bump patch version
      id: bump
      run: |
        CURRENT=$(node -p "require('./package.json').version")
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
        NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
        echo "version=${NEW}" >> $GITHUB_OUTPUT
        echo "Bumping ${CURRENT} -> ${NEW}"
        node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json'));p.version='${NEW}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

    - name: Commit and tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add package.json
        git commit -m "chore: release v${{ steps.bump.outputs.version }}"
        git tag "v${{ steps.bump.outputs.version }}"
        git push origin main --tags

  test:
    needs: bump-version
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.head_commit.id }}
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm install
    - run: npm test

  deploy:
    needs: test
    if: success()
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.head_commit.id }}

    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install and build
      run: |
        npm install
        npx next build --webpack

    - name: Deploy to server via rsync
      uses: burnett01/rsync-deployments@6.0.0
      with:
        switches: -avzr --delete --exclude='data' --exclude='.env'
        path: ./
        remote_path: /home/admin/project/xiaohongshu/
        remote_host: ${{ secrets.SERVER_HOST }}
        remote_user: ${{ secrets.SERVER_USER }}
        remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Restart services
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -euo pipefail
          cd /home/admin/project/xiaohongshu

          pm2 delete xiaohongshu-web 2>/dev/null || true
          pm2 delete xiaohongshu-worker 2>/dev/null || true

          pm2 start "npx next start -p 3002" --name xiaohongshu-web
          pm2 start "bash -c 'set -a && source .env && set +a && npx tsx src/worker.ts'" --name xiaohongshu-worker
          pm2 save

          echo "Deploy complete!"
