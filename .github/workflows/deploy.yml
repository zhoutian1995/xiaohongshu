name: CI/CD

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Bump patch version
      id: bump
      run: |
        CURRENT=$(node -p "require('./package.json').version")
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
        NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
        echo "version=${NEW}" >> $GITHUB_OUTPUT
        echo "Bumping ${CURRENT} -> ${NEW}"
        node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json'));p.version='${NEW}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

    - name: Commit and tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add package.json
        git commit -m "chore: release v${{ steps.bump.outputs.version }}"
        git tag "v${{ steps.bump.outputs.version }}"
        git push origin main --tags

  test:
    needs: bump-version
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.head_commit.id }}
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm install
    - run: npm test

  deploy:
    needs: test
    if: success()
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.head_commit.id }}

    - name: Deploy to server
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -euo pipefail
          cd /home/admin/project

          # Backup data + env
          mkdir -p /tmp/xhs-backup
          if [ -d "xiaohongshu/data" ]; then
            cp -r xiaohongshu/data /tmp/xhs-backup/ 2>/dev/null || true
          fi
          if [ -f "xiaohongshu/.env" ]; then
            cp xiaohongshu/.env /tmp/xhs-backup/.env 2>/dev/null || true
          fi

          # Download latest code
          rm -rf xiaohongshu-next /tmp/xhs-extract /tmp/xhs.zip
          mkdir -p xiaohongshu-next /tmp/xhs-extract
          curl -fsSL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/zipball/main" \
            -o /tmp/xhs.zip
          test -s /tmp/xhs.zip
          unzip -tq /tmp/xhs.zip
          unzip -q /tmp/xhs.zip -d /tmp/xhs-extract
          EXTRACTED=$(find /tmp/xhs-extract -mindepth 1 -maxdepth 1 -type d | head -1)
          cp -r "$EXTRACTED"/* xiaohongshu-next/
          cp -r "$EXTRACTED"/.[!.]* xiaohongshu-next/ 2>/dev/null || true

          # Restore backup
          if [ -d "/tmp/xhs-backup/data" ]; then
            mkdir -p xiaohongshu-next/data
            cp -r /tmp/xhs-backup/data/* xiaohongshu-next/data/ 2>/dev/null || true
          fi
          if [ -f "/tmp/xhs-backup/.env" ]; then
            cp /tmp/xhs-backup/.env xiaohongshu-next/.env
          fi

          # Install + build
          cd xiaohongshu-next
          npm install --omit=dev 2>&1 | tail -3
          npx next build --webpack 2>&1 | tail -5
          cd ..

          # Swap directories
          rm -rf xiaohongshu-prev
          if [ -d "xiaohongshu" ]; then
            mv xiaohongshu xiaohongshu-prev
          fi
          mv xiaohongshu-next xiaohongshu

          # Restart services
          pm2 delete xiaohongshu-web 2>/dev/null || true
          pm2 delete xiaohongshu-worker 2>/dev/null || true

          cd xiaohongshu

          if ! pm2 start "npx next start -p 3002" --name xiaohongshu-web; then
            echo "Web start failed, rolling back"
            cd ..
            rm -rf xiaohongshu
            mv xiaohongshu-prev xiaohongshu
            cd xiaohongshu
            pm2 start "npx next start -p 3002" --name xiaohongshu-web
            exit 1
          fi

          if ! pm2 start "npx tsx src/worker.ts" --name xiaohongshu-worker; then
            echo "Worker start failed"
            pm2 delete xiaohongshu-web 2>/dev/null || true
            cd ..
            rm -rf xiaohongshu
            mv xiaohongshu-prev xiaohongshu
            cd xiaohongshu
            pm2 start "npx next start -p 3002" --name xiaohongshu-web
            pm2 start "npx tsx src/worker.ts" --name xiaohongshu-worker
            exit 1
          fi

          pm2 save
          rm -rf xiaohongshu-prev /tmp/xhs-backup /tmp/xhs-extract /tmp/xhs.zip

          echo "Deploy complete!"
